<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17579b"><title>CLIP Teams Multas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--b:#17579b;--r:#e63b2f;--bg:#f5f7fb;--ink:#15263c;--m:#6d7888}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:3;background:white;border-bottom:1px solid #e6ebf2;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;object-fit:contain}.brand b{color:var(--b);font-size:18px}.lang,.btn,.ghost,.danger{border:0;border-radius:10px;padding:9px 12px;font-weight:700}.lang,.ghost{background:#edf3fb;color:var(--b)}.btn{background:var(--r);color:#fff}.danger{background:#fdebea;color:#b52c24}nav{position:sticky;top:69px;z-index:2;display:flex;overflow:auto;background:white;border-bottom:1px solid #e6ebf2}nav button{border:0;background:white;padding:11px 14px;white-space:nowrap;color:#677385}nav button.on{color:var(--b);font-weight:800;border-bottom:3px solid var(--r)}main{max-width:1000px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#17579b,#0d477d);color:#fff;border-radius:20px;padding:22px;display:flex;justify-content:space-between;gap:14px;align-items:end}.hero h1{margin:4px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.card,section{background:white;border:1px solid #e5eaf0;border-radius:16px}.card{padding:14px}.card small{color:var(--m)}.card b{display:block;font-size:24px;color:var(--b);margin-top:5px}section{padding:16px;margin:14px 0}h2{margin:0 0 10px;color:#17385e}.row{display:grid;grid-template-columns:1fr 100px 95px 84px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #edf1f5}.row small{display:block;color:var(--m)}.badge{border:0;border-radius:999px;padding:7px 9px;font-weight:800}.paid{background:#e8f7f0;color:#137850}.unpaid{background:#fdebea;color:#b52c24}.rank{display:grid;grid-template-columns:36px 1fr 100px;gap:10px;padding:10px 0;border-top:1px solid #edf1f5}.place{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef2f6;font-weight:900}.teamgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.member,.rule,.log{border-top:1px solid #edf1f5;padding:10px 0}.member{display:flex;justify-content:space-between;gap:10px}.modalwrap{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:9}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:18px}label{display:block;font-weight:700;font-size:14px;margin:10px 0}input,select,textarea{width:100%;padding:9px;border:1px solid #d7dfe9;border-radius:9px;margin-top:5px}textarea{min-height:70px}.actions{display:flex;gap:7px;justify-content:flex-end}.toast{position:fixed;right:14px;bottom:14px;background:#17385e;color:#fff;padding:10px 13px;border-radius:10px;z-index:20}
@media(max-width:720px){.cards{grid-template-columns:repeat(2,1fr)}.teamgrid{grid-template-columns:1fr}.row{grid-template-columns:1fr 75px 85px}.row .actions{grid-column:1/-1}.hero{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header><div class="brand"><img src="https://raw.githubusercontent.com/mariasabessa/clip-teams-multas/main/logo.jpg" onerror="this.style.display='none'"><b id="appname">CLIP Teams Multas</b></div><button id="lang" class="lang">EN</button></header>
<nav id="nav"></nav><main id="app">A carregar…</main><div id="modal"></div>
<script>
const U='https://ilsavdfwafitqymiqoda.supabase.co',K='sb_publishable_5kx7PNshlnNsZ-8uzYUtfw_xnejQkve';
const db=supabase.createClient(U,K);let L=localStorage.clip_lang||'pt',tab='home',members=[],rules=[],fines=[],logs=[];
const tx={pt:{app:'CLIP Teams Multas',home:'Início',fines:'Multas',team:'Equipa',ranking:'Ranking',payments:'Pagamentos',rules:'Regras',history:'Histórico',add:'Adicionar multa',out:'Por pagar',col:'Recebido',uf:'Multas por pagar',ow:'Pessoas com dívida',recent:'Multas recentes',hall:'Hall of Shame',player:'Jogadora',coach:'Treinador',players:'Jogadoras',coaches:'Treinadores',paid:'Pago',unpaid:'Por pagar',person:'Pessoa',fineType:'Tipo de multa',date:'Data',notes:'Notas',minutes:'Minutos de atraso',status:'Estado',save:'Guardar',cancel:'Cancelar',teamTitle:'Equipa',active:'Ativo',inactive:'Inativo',name:'Nome',type:'Tipo',total:'Total recebido',addMember:'Adicionar pessoa',addRule:'Adicionar regra',amount:'Valor',calc:'Cálculo',fixed:'Fixo',perMinute:'Por minuto',custom:'Personalizado',descPT:'Descrição PT',descEN:'Descrição EN',confirm:'Tens a certeza?',noData:'Sem dados'},en:{app:'CLIP Teams Fines',home:'Home',fines:'Fines',team:'Team',ranking:'Ranking',payments:'Payments',rules:'Rules',history:'History',add:'Add fine',out:'Outstanding',col:'Collected',uf:'Unpaid fines',ow:'People owing money',recent:'Recent fines',hall:'Hall of Shame',player:'Player',coach:'Coach',players:'Players',coaches:'Coaches',paid:'Paid',unpaid:'Unpaid',person:'Person',fineType:'Fine type',date:'Date',notes:'Notes',minutes:'Minutes late',status:'Status',save:'Save',cancel:'Cancel',teamTitle:'Team',active:'Active',inactive:'Inactive',name:'Name',type:'Type',total:'Total collected',addMember:'Add person',addRule:'Add rule',amount:'Amount',calc:'Calculation',fixed:'Fixed',perMinute:'Per minute',custom:'Custom',descPT:'Description PT',descEN:'Description EN',confirm:'Are you sure?',noData:'No data'}};
const t=()=>tx[L],money=n=>new Intl.NumberFormat(L==='pt'?'pt-PT':'en-IE',{style:'currency',currency:'EUR'}).format(Number(n||0)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function rn(r){return L==='pt'?r.name_pt:r.name_en}
async function refresh(){let a=await Promise.all([db.from('team_members').select('*').order('name'),db.from('fine_types').select('*').order('created_at'),db.from('fines').select('*,team_members(name,member_type),fine_types(name_pt,name_en,calculation_type)').order('fine_date',{ascending:false}),db.from('activity_history').select('*').order('created_at',{ascending:false}).limit(50)]);members=a[0].data||[];rules=a[1].data||[];fines=a[2].data||[];logs=a[3].data||[];render()}
function stats(){const u=fines.filter(x=>x.status==='unpaid');return{out:u.reduce((s,x)=>s+Number(x.amount),0),col:fines.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.amount),0),uf:u.length,ow:new Set(u.map(x=>x.team_member_id)).size}}
function ranking(){return members.map(m=>{const u=fines.filter(x=>x.team_member_id===m.id&&x.status==='unpaid');return{...m,b:u.reduce((s,x)=>s+Number(x.amount),0),n:u.length}}).sort((a,b)=>b.b-a.b)}
function nav(){let items=[['home','🏠',t().home],['fines','💸',t().fines],['team','👥',t().team],['ranking','🏆',t().ranking],['payments','✅',t().payments],['rules','⚙️',t().rules],['history','🕘',t().history]];document.getElementById('nav').innerHTML=items.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+' '+x[2]+'</button>').join('')}
function fineRow(f){const name=f.fine_types?rn(f.fine_types):(L==='pt'?f.fine_type_name_pt:f.fine_type_name_en);return '<div class="row"><div><b>'+esc(f.team_members?.name||'')+'</b><small>'+esc(name)+' · '+f.fine_date+(f.notes?' · '+esc(f.notes):'')+'</small></div><b>'+money(f.amount)+'</b><button class="badge '+(f.status==='paid'?'paid':'unpaid')+'" onclick="togglePaid('+f.id+')">'+(f.status==='paid'?t().paid:t().unpaid)+'</button><div class="actions"><button class="ghost" onclick="openFine('+f.id+')">✏️</button><button class="danger" onclick="deleteFine('+f.id+')">🗑️</button></div></div>'}
function memberCard(m){let r=ranking().find(x=>x.id===m.id)||{b:0,n:0};return '<div class="member"><div><b>'+esc(m.name)+'</b><small>'+money(r.b)+' · '+r.n+' '+t().uf.toLowerCase()+'</small></div><div class="actions"><button class="ghost" onclick="openMember('+m.id+')">✏️</button><button class="danger" onclick="deleteMember('+m.id+')">🗑️</button></div></div>'}
function render(){document.getElementById('appname').textContent=t().app;document.title=t().app;document.getElementById('lang').textContent=L==='pt'?'EN':'PT';nav();const s=stats(),rk=ranking();let h='';
if(tab==='home')h='<div class="hero"><div><small>CLIP Teams</small><h1>'+t().app+'</h1></div><button class="btn" onclick="openFine()">＋ '+t().add+'</button></div><div class="cards"><div class="card"><small>💸 '+t().out+'</small><b>'+money(s.out)+'</b></div><div class="card"><small>✅ '+t().col+'</small><b>'+money(s.col)+'</b></div><div class="card"><small>📋 '+t().uf+'</small><b>'+s.uf+'</b></div><div class="card"><small>👥 '+t().ow+'</small><b>'+s.ow+'</b></div></div><section><h2>🏆 '+t().hall+'</h2>'+rk.slice(0,5).map((m,i)=>'<div class="rank"><span class="place">'+(i+1)+'</span><b>'+esc(m.name)+'</b><strong>'+money(m.b)+'</strong></div>').join('')+'</section><section><h2>'+t().recent+'</h2>'+fines.slice(0,6).map(fineRow).join('')+'</section>';
if(tab==='fines')h='<section><h2>'+t().fines+' <button class="btn" style="float:right" onclick="openFine()">＋ '+t().add+'</button></h2>'+fines.map(fineRow).join('')+'</section>';
if(tab==='team')h='<section><h2>'+t().teamTitle+' <button class="btn" style="float:right" onclick="openMember()">＋ '+t().addMember+'</button></h2><h3>'+t().players+'</h3><div class="teamgrid">'+members.filter(m=>m.member_type==='player').map(memberCard).join('')+'</div><h3>'+t().coaches+'</h3><div class="teamgrid">'+members.filter(m=>m.member_type==='coach').map(memberCard).join('')+'</div></section>';
if(tab==='ranking')h='<section><h2>🏆 '+t().hall+'</h2>'+rk.map((m,i)=>'<div class="rank"><span class="place">'+(i+1)+'</span><b>'+esc(m.name)+'</b><strong>'+money(m.b)+'</strong></div>').join('')+'</section>';
if(tab==='payments')h='<section><h2>'+t().payments+'</h2><div class="card" style="margin-bottom:10px"><small>'+t().total+'</small><b>'+money(s.col)+'</b></div>'+fines.filter(f=>f.status==='paid').map(fineRow).join('')+'</section>';
if(tab==='rules')h='<section><h2>'+t().rules+' <button class="btn" style="float:right" onclick="openRule()">＋ '+t().addRule+'</button></h2>'+rules.map(r=>'<div class="rule"><b>'+esc(rn(r))+'</b><small>'+(r.calculation_type==='per_minute'?money(r.amount)+' / min':money(r.amount))+' · '+(r.active?t().active:t().inactive)+'</small><div class="actions"><button class="ghost" onclick="openRule('+r.id+')">✏️</button><button class="danger" onclick="deleteRule('+r.id+')">🗑️</button></div></div>').join('')+'</section>';
if(tab==='history')h='<section><h2>'+t().history+'</h2>'+logs.map(x=>'<div class="log"><b>'+esc(x.action.replaceAll('_',' '))+'</b><small>'+esc(x.details||'')+' · '+new Date(x.created_at).toLocaleString(L==='pt'?'pt-PT':'en-GB')+'</small></div>').join('')+'</section>';
document.getElementById('app').innerHTML=h}
function closeModal(){document.getElementById('modal').innerHTML=''}function modal(x){document.getElementById('modal').innerHTML='<div class="modalwrap" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">'+x+'</div></div>'}
function openFine(id){let f=fines.find(x=>x.id==id)||{};modal('<form onsubmit="saveFine(event,'+(f.id||0)+')"><h2>'+t().add+'</h2><label>'+t().person+'<select name="m" required><option></option>'+members.filter(m=>m.active).map(m=>'<option value="'+m.id+'" '+(m.id==f.team_member_id?'selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select></label><label>'+t().fineType+'<select name="r" id="rf" required onchange="extra()"><option></option>'+rules.filter(r=>r.active).map(r=>'<option value="'+r.id+'" '+(r.id==f.fine_type_id?'selected':'')+'>'+esc(rn(r))+'</option>').join('')+'</select></label><div id="extra"></div><label>'+t().date+'<input type="date" name="date" value="'+(f.fine_date||new Date().toISOString().slice(0,10))+'" required></label><label>'+t().notes+'<textarea name="notes">'+esc(f.notes||'')+'</textarea></label><label>'+t().status+'<select name="status"><option value="unpaid" '+(f.status!=='paid'?'selected':'')+'>'+t().unpaid+'</option><option value="paid" '+(f.status==='paid'?'selected':'')+'>'+t().paid+'</option></select></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">'+t().cancel+'</button><button class="btn">'+t().save+'</button></div></form>');extra(f)}
function extra(f={}){let r=rules.find(x=>x.id==document.getElementById('rf')?.value),e=document.getElementById('extra');if(!e)return;e.innerHTML=r?.calculation_type==='per_minute'?'<label>'+t().minutes+'<input type="number" min="0" name="minutes" value="'+(f.minutes||0)+'" required></label>':r?.calculation_type==='custom'?'<label>'+t().amount+'<input type="number" min="0" step="0.01" name="custom" value="'+(f.amount||0)+'" required></label>':''}
async function saveFine(e,id){e.preventDefault();let fd=new FormData(e.target),r=rules.find(x=>x.id==fd.get('r')),mins=null,a=Number(r?.amount||0);if(r?.calculation_type==='per_minute'){mins=Math.max(0,Number(fd.get('minutes')||0));a*=mins}if(r?.calculation_type==='custom')a=Math.max(0,Number(fd.get('custom')||0));let st=fd.get('status'),p={team_member_id:Number(fd.get('m')),fine_type_id:Number(fd.get('r')),fine_type_name_pt:r?.name_pt||'',fine_type_name_en:r?.name_en||'',fine_date:fd.get('date'),minutes:mins,amount:Number(a.toFixed(2)),notes:fd.get('notes')||null,status:st,paid_at:st==='paid'?new Date().toISOString():null};if(id)await db.from('fines').update(p).eq('id',id);else await db.from('fines').insert(p);await log(id?'fine_edited':'fine_created',(members.find(m=>m.id===p.team_member_id)?.name||'')+' · '+money(p.amount));closeModal();refresh()}
async function togglePaid(id){let f=fines.find(x=>x.id==id),paid=f.status!=='paid';await db.from('fines').update({status:paid?'paid':'unpaid',paid_at:paid?new Date().toISOString():null}).eq('id',id);await log(paid?'fine_paid':'fine_unpaid',f.team_members?.name||'');refresh()}
async function deleteFine(id){if(!confirm(t().confirm))return;let f=fines.find(x=>x.id==id);await db.from('fines').delete().eq('id',id);await log('fine_deleted',f?.team_members?.name||'');refresh()}
function openMember(id){let m=members.find(x=>x.id==id)||{};modal('<form onsubmit="saveMember(event,'+(m.id||0)+')"><h2>'+t().team+'</h2><label>'+t().name+'<input name="name" value="'+esc(m.name||'')+'" required></label><label>'+t().type+'<select name="type"><option value="player" '+(m.member_type!=='coach'?'selected':'')+'>'+t().player+'</option><option value="coach" '+(m.member_type==='coach'?'selected':'')+'>'+t().coach+'</option></select></label><label>'+t().status+'<select name="active"><option value="true" '+(m.active!==false?'selected':'')+'>'+t().active+'</option><option value="false" '+(m.active===false?'selected':'')+'>'+t().inactive+'</option></select></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">'+t().cancel+'</button><button class="btn">'+t().save+'</button></div></form>')}
async function saveMember(e,id){e.preventDefault();let fd=new FormData(e.target),p={name:fd.get('name'),member_type:fd.get('type'),active:fd.get('active')==='true'};if(id)await db.from('team_members').update(p).eq('id',id);else await db.from('team_members').insert(p);await log(id?'member_edited':'member_created',p.name);closeModal();refresh()}
async function deleteMember(id){if(!confirm(t().confirm))return;let m=members.find(x=>x.id==id),q=await db.from('team_members').delete().eq('id',id);if(q.error){alert(L==='pt'?'Não é possível apagar uma pessoa com multas associadas. Marca-a como inativa.':'Cannot delete a person with linked fines. Mark them inactive instead.');return}await log('member_deleted',m?.name||'');refresh()}
function openRule(id){let r=rules.find(x=>x.id==id)||{};modal('<form onsubmit="saveRule(event,'+(r.id||0)+')"><h2>'+t().rules+'</h2><label>Nome PT<input name="pt" value="'+esc(r.name_pt||'')+'" required></label><label>Name EN<input name="en" value="'+esc(r.name_en||'')+'" required></label><label>'+t().calc+'<select name="calc"><option value="fixed" '+(r.calculation_type==='fixed'?'selected':'')+'>'+t().fixed+'</option><option value="per_minute" '+(r.calculation_type==='per_minute'?'selected':'')+'>'+t().perMinute+'</option><option value="custom" '+(r.calculation_type==='custom'?'selected':'')+'>'+t().custom+'</option></select></label><label>'+t().amount+'<input type="number" min="0" step="0.01" name="amount" value="'+(r.amount||0)+'" required></label><label>'+t().descPT+'<textarea name="dpt">'+esc(r.description_pt||'')+'</textarea></label><label>'+t().descEN+'<textarea name="den">'+esc(r.description_en||'')+'</textarea></label><label>'+t().status+'<select name="active"><option value="true" '+(r.active!==false?'selected':'')+'>'+t().active+'</option><option value="false" '+(r.active===false?'selected':'')+'>'+t().inactive+'</option></select></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">'+t().cancel+'</button><button class="btn">'+t().save+'</button></div></form>')}
async function saveRule(e,id){e.preventDefault();let fd=new FormData(e.target),p={name_pt:fd.get('pt'),name_en:fd.get('en'),description_pt:fd.get('dpt')||null,description_en:fd.get('den')||null,calculation_type:fd.get('calc'),amount:Number(fd.get('amount')),active:fd.get('active')==='true'};if(id)await db.from('fine_types').update(p).eq('id',id);else await db.from('fine_types').insert(p);await log(id?'rule_edited':'rule_created',L==='pt'?p.name_pt:p.name_en);closeModal();refresh()}
async function deleteRule(id){if(!confirm(t().confirm))return;let r=rules.find(x=>x.id==id);await db.from('fine_types').delete().eq('id',id);await log('rule_deleted',rn(r));refresh()}
async function log(action,details){await db.from('activity_history').insert({action,details})}
document.getElementById('lang').onclick=()=>{L=L==='pt'?'en':'pt';localStorage.clip_lang=L;render()};refresh();
</script></body></html>
