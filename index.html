<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17579b"><title>Multas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=League+Spartan:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--b:#17579b;--b2:#0d477d;--r:#ef3d32;--bg:#f5f7fb;--ink:#122238;--m:#68758a;--line:#e4eaf2;--shadow:0 10px 30px rgba(21,50,86,.07)}
*{box-sizing:border-box}body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#f8fafe 0,#f4f7fb 45%,#f7f9fc 100%);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
h1,h2,h3,.brand b,.card b,.rank strong{font-family:'League Spartan','Inter',sans-serif}
header{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;min-height:116px;overflow:visible}.brand{display:flex;align-items:center;gap:16px;overflow:visible;min-width:0}.brand img{width:96px;height:auto;max-height:96px;object-fit:contain;object-position:center;display:block;flex:0 0 auto}.brand b{color:var(--b);font-size:23px;font-weight:800;letter-spacing:-.4px}
.lang-switch{display:flex;align-items:center;border:2px solid #d7dfeb;border-radius:999px;padding:5px;background:#fff;box-shadow:0 4px 14px rgba(21,50,86,.04)}.lang-switch button{border:0;background:transparent;color:#67748a;border-radius:999px;padding:10px 15px;font-weight:800;min-width:54px}.lang-switch button.active{background:var(--b);color:white;box-shadow:0 4px 10px rgba(23,87,155,.24)}.lang-divider{width:2px;height:24px;background:#d9e0e9;margin:0 2px}
.btn,.ghost,.danger{border:0;border-radius:12px;padding:10px 14px;font-weight:800;transition:.18s ease}.btn{background:linear-gradient(135deg,var(--r),#df2f28);color:#fff;box-shadow:0 6px 16px rgba(239,61,50,.22)}.btn:hover{transform:translateY(-1px)}.ghost{background:#edf3fb;color:var(--b)}.danger{background:#fdebea;color:#b52c24}
nav{position:sticky;top:116px;z-index:2;display:flex;overflow:auto;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 8px}nav button{border:0;background:transparent;padding:13px 14px;white-space:nowrap;color:#68758a;font-weight:600}nav button.on{color:var(--b);font-weight:800;border-bottom:3px solid var(--r)}
main{max-width:1100px;margin:auto;padding:24px 18px 42px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2465aa 0%,#0c497f 100%);color:#fff;border-radius:26px;padding:30px 34px;display:flex;justify-content:space-between;gap:18px;align-items:end;box-shadow:var(--shadow)}.hero:after{content:'🏀';position:absolute;right:32px;top:-38px;font-size:145px;opacity:.08;transform:rotate(-18deg);pointer-events:none}.hero small{font-size:16px;opacity:.9}.hero h1{margin:7px 0 0;font-size:44px;line-height:.95;letter-spacing:-1.3px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card,section{background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.card{padding:18px}.card small{color:var(--m);font-weight:600}.card b{display:block;font-size:30px;color:var(--b);margin-top:7px}
section{padding:20px 22px;margin:18px 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px}.section-head h2{margin:0}.section-head .btn{flex:0 0 auto}h2{margin:0 0 12px;color:#17385e;font-size:31px;letter-spacing:-.6px}h3{color:#17385e;font-size:23px;margin:24px 0 8px}.sub{color:var(--m);margin:-5px 0 14px;font-size:14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 105px 92px;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #edf1f5}.row:first-of-type{border-top:0}.row small{display:block;color:var(--m);margin-top:4px;line-height:1.45}.row>b{justify-self:end}.badge{border:0;border-radius:999px;padding:8px 11px;font-weight:800}.paid{background:#e8f7f0;color:#137850}.unpaid{background:#fdebea;color:#b52c24}
.rank{display:grid;grid-template-columns:42px minmax(0,1fr) 105px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #edf1f5}.rank:first-of-type{border-top:0}.rank strong{justify-self:end;font-size:18px;color:#17385e}.place{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eef2f6;font-weight:900}.rank:nth-of-type(1) .place{background:#fff0ad}.rank:nth-of-type(2) .place{background:#e7ebf1}.rank:nth-of-type(3) .place{background:#f2d4bd}
.teamgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}.member,.rule,.log{border-top:1px solid #edf1f5;padding:15px 0}.member{display:flex;justify-content:space-between;align-items:center;gap:18px}.member b,.rule b,.log b{font-size:16px}.member small,.rule small,.log small{display:block;color:var(--m);margin-top:6px;line-height:1.45}.member .actions,.rule .actions{margin-left:auto}
.rule{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:18px;align-items:center}.rule-meta{color:var(--m);font-weight:600;white-space:nowrap}.log{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;align-items:start}.log .action{color:#17385e}.log small{margin-top:0}
.modalwrap{position:fixed;inset:0;background:#09192c99;display:grid;place-items:center;padding:16px;z-index:9;backdrop-filter:blur(3px)}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:22px;box-shadow:0 25px 80px #0003}label{display:block;font-weight:700;font-size:14px;margin:12px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #d7dfe9;border-radius:10px;margin-top:6px;background:#fff}textarea{min-height:80px}.actions{display:flex;gap:8px;justify-content:flex-end}.empty{color:var(--m);text-align:center;padding:18px}
@media(max-width:760px){header{min-height:94px;padding:8px 12px;overflow:visible}.brand img{width:76px;height:auto;max-height:76px;object-fit:contain;display:block}.brand b{font-size:18px}.lang-switch button{padding:8px 10px;min-width:44px}.lang-divider{height:20px}nav{top:94px}.cards{grid-template-columns:repeat(2,1fr)}main{padding:16px 12px 34px}.hero{padding:24px 22px;border-radius:22px;flex-direction:column;align-items:flex-start}.hero h1{font-size:35px}.hero:after{font-size:105px}.section-head{align-items:flex-start;flex-direction:column}.section-head .btn{width:100%}.row{grid-template-columns:minmax(0,1fr) 82px 90px}.row .actions{grid-column:1/-1}.teamgrid{grid-template-columns:1fr}.rule{grid-template-columns:minmax(0,1fr) auto}.rule .actions{grid-column:1/-1}.log{grid-template-columns:1fr;gap:4px}.member{align-items:flex-start}.brand{gap:8px}}</style>
</head>
<body>
<header><div class="brand"><img src="https://raw.githubusercontent.com/mariasabessa/clip-teams-multas/main/logo-new.jpg" onerror="this.style.display='none'"><b id="appname">Multas</b></div><div class="lang-switch" aria-label="Language"><button id="langPt">PT</button><span class="lang-divider"></span><button id="langEn">EN</button></div></header>
<nav id="nav"></nav><main id="app">A carregar…</main><div id="modal"></div>
<script>
const U='https://ilsavdfwafitqymiqoda.supabase.co',K='sb_publishable_5kx7PNshlnNsZ-8uzYUtfw_xnejQkve';
const db=supabase.createClient(U,K);let L=localStorage.clip_lang||'pt',tab='home',members=[],rules=[],fines=[],logs=[];
const tx={pt:{app:'Multas',home:'Início',fines:'Multas',team:'Equipa',ranking:'Ranking',payments:'Pagamentos',rules:'Regras',history:'Histórico',add:'Adicionar multa',out:'Por pagar',col:'Pago',uf:'Multas por pagar',ow:'Pessoas com dívida',recent:'Multas recentes',hall:'Hall of Shame',hallSub:'A classificação que ninguém quer liderar 🏀',player:'Jogadora',coach:'Treinador',players:'Jogadoras',coaches:'Treinadores',paid:'Pago',unpaid:'Por pagar',person:'Pessoa',fineType:'Tipo de multa',date:'Data',notes:'Notas',minutes:'Minutos de atraso',status:'Estado',save:'Guardar',cancel:'Cancelar',teamTitle:'Equipa',active:'Ativo',inactive:'Inativo',name:'Nome',type:'Tipo',total:'Total recebido',addMember:'Adicionar pessoa',addRule:'Adicionar regra',amount:'Valor',calc:'Cálculo',fixed:'Fixo',perMinute:'Por minuto',custom:'Personalizado',descPT:'Descrição PT',descEN:'Descrição EN',confirm:'Tens a certeza?',noData:'Sem dados'},en:{app:'Fines',home:'Home',fines:'Fines',team:'Team',ranking:'Ranking',payments:'Payments',rules:'Rules',history:'History',add:'Add fine',out:'Unpaid',col:'Paid',uf:'Unpaid fines',ow:'People owing money',recent:'Recent fines',hall:'Hall of Shame',hallSub:'The leaderboard nobody wants to lead 🏀',player:'Player',coach:'Coach',players:'Players',coaches:'Coaches',paid:'Paid',unpaid:'Unpaid',person:'Person',fineType:'Fine type',date:'Date',notes:'Notes',minutes:'Minutes late',status:'Status',save:'Save',cancel:'Cancel',teamTitle:'Team',active:'Active',inactive:'Inactive',name:'Name',type:'Type',total:'Total paid',addMember:'Add person',addRule:'Add rule',amount:'Amount',calc:'Calculation',fixed:'Fixed',perMinute:'Per minute',custom:'Custom',descPT:'Description PT',descEN:'Description EN',confirm:'Are you sure?',noData:'No data'}};
const t=()=>tx[L],money=n=>new Intl.NumberFormat(L==='pt'?'pt-PT':'en-IE',{style:'currency',currency:'EUR'}).format(Number(n||0)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function rn(r){return L==='pt'?r.name_pt:r.name_en}
function unpaidFinesLabel(n){if(L==='pt')return n+' '+(n===1?'multa por pagar':'multas por pagar');return n+' '+(n===1?'unpaid fine':'unpaid fines')}
function actionLabel(a){const map={pt:{fine_edited:'Multa editada',fine_created:'Multa criada',fine_paid:'Multa paga',fine_unpaid:'Multa marcada por pagar',fine_deleted:'Multa apagada',member_edited:'Pessoa editada',member_created:'Pessoa adicionada',member_deleted:'Pessoa removida',rule_edited:'Regra editada',rule_created:'Regra criada',rule_deleted:'Regra apagada'},en:{fine_edited:'Fine edited',fine_created:'Fine created',fine_paid:'Fine paid',fine_unpaid:'Fine marked unpaid',fine_deleted:'Fine deleted',member_edited:'Member edited',member_created:'Member added',member_deleted:'Member removed',rule_edited:'Rule edited',rule_created:'Rule created',rule_deleted:'Rule deleted'}};return map[L][a]||a.replaceAll('_',' ')}
async function refresh(){let a=await Promise.all([db.from('team_members').select('*').order('name'),db.from('fine_types').select('*').order('created_at'),db.from('fines').select('*,team_members(name,member_type),fine_types(name_pt,name_en,calculation_type)').order('fine_date',{ascending:false}),db.from('activity_history').select('*').order('created_at',{ascending:false}).limit(50)]);members=a[0].data||[];rules=a[1].data||[];fines=a[2].data||[];logs=a[3].data||[];render()}
function stats(){const u=fines.filter(x=>x.status==='unpaid');return{out:u.reduce((s,x)=>s+Number(x.amount),0),col:fines.filter(x=>x.status==='paid').reduce((s,x)=>s+Number(x.amount),0),uf:u.length,ow:new Set(u.map(x=>x.team_member_id)).size}}
function ranking(){return members.map(m=>{const u=fines.filter(x=>x.team_member_id===m.id&&x.status==='unpaid');return{...m,b:u.reduce((s,x)=>s+Number(x.amount),0),n:u.length}}).sort((a,b)=>b.b-a.b)}
function nav(){let items=[['home','🏠',t().home],['fines','💸',t().fines],['team','👥',t().team],['ranking','🏆',t().ranking],['payments','✅',t().payments],['rules','⚙️',t().rules],['history','🕘',t().history]];document.getElementById('nav').innerHTML=items.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+' '+x[2]+'</button>').join('')}
function fineRow(f){const name=f.fine_types?rn(f.fine_types):(L==='pt'?f.fine_type_name_pt:f.fine_type_name_en);return '<div class="row"><div><b>'+esc(f.team_members?.name||'')+'</b><small>'+esc(name)+' · '+f.fine_date+(f.notes?' · '+esc(f.notes):'')+'</small></div><b>'+money(f.amount)+'</b><button class="badge '+(f.status==='paid'?'paid':'unpaid')+'" onclick="togglePaid('+f.id+')">'+(f.status==='paid'?t().paid:t().unpaid)+'</button><div class="actions"><button class="ghost" onclick="openFine('+f.id+')">✏️</button><button class="danger" onclick="deleteFine('+f.id+')">🗑️</button></div></div>'}
function memberCard(m){let r=ranking().find(x=>x.id===m.id)||{b:0,n:0};return '<div class="member"><div><b>'+esc(m.name)+'</b><small>'+money(r.b)+' &nbsp;·&nbsp; '+unpaidFinesLabel(r.n)+'</small></div><div class="actions"><button class="ghost" onclick="openMember('+m.id+')">✏️</button><button class="danger" onclick="deleteMember('+m.id+')">🗑️</button></div></div>'}
function render(){document.getElementById('appname').textContent=t().app;document.title=t().app;document.getElementById('langPt').classList.toggle('active',L==='pt');document.getElementById('langEn').classList.toggle('active',L==='en');nav();const s=stats(),rk=ranking();let h='';
if(tab==='home')h='<div class="hero"><div><small>CLIP Teams · Basketball</small><h1>'+t().app+'</h1></div><button class="btn" onclick="openFine()">＋ '+t().add+'</button></div><div class="cards"><div class="card"><small>💸 '+t().out+'</small><b>'+money(s.out)+'</b></div><div class="card"><small>✅ '+t().col+'</small><b>'+money(s.col)+'</b></div><div class="card"><small>📋 '+t().uf+'</small><b>'+s.uf+'</b></div><div class="card"><small>👥 '+t().ow+'</small><b>'+s.ow+'</b></div></div><section><h2>🏆 '+t().hall+'</h2><p class="sub">'+t().hallSub+'</p>'+rk.slice(0,5).map((m,i)=>'<div class="rank"><span class="place">'+(i+1)+'</span><b>'+esc(m.name)+'</b><strong>'+money(m.b)+'</strong></div>').join('')+'</section><section><h2>'+t().recent+'</h2>'+fines.slice(0,6).map(fineRow).join('')+'</section>';
if(tab==='fines')h='<section><div class="section-head"><h2>'+t().fines+'</h2><button class="btn" onclick="openFine()">＋ '+t().add+'</button></div>'+fines.map(fineRow).join('')+'</section>';
if(tab==='team')h='<section><div class="section-head"><h2>'+t().teamTitle+'</h2><button class="btn" onclick="openMember()">＋ '+t().addMember+'</button></div><h3>'+t().players+'</h3><div class="teamgrid">'+members.filter(m=>m.member_type==='player').map(memberCard).join('')+'</div><h3>'+t().coaches+'</h3><div class="teamgrid">'+members.filter(m=>m.member_type==='coach').map(memberCard).join('')+'</div></section>';
if(tab==='ranking')h='<section><h2>🏆 '+t().hall+'</h2><p class="sub">'+t().hallSub+'</p>'+rk.map((m,i)=>'<div class="rank"><span class="place">'+(i+1)+'</span><b>'+esc(m.name)+'</b><strong>'+money(m.b)+'</strong></div>').join('')+'</section>';
if(tab==='payments')h='<section><h2>'+t().payments+'</h2><div class="card" style="margin-bottom:14px"><small>'+t().total+'</small><b>'+money(s.col)+'</b></div>'+fines.filter(f=>f.status==='paid').map(fineRow).join('')+'</section>';
if(tab==='rules')h='<section><div class="section-head"><h2>'+t().rules+'</h2><button class="btn" onclick="openRule()">＋ '+t().addRule+'</button></div>'+rules.map(r=>'<div class="rule"><div><b>'+esc(rn(r))+'</b><small>'+(r.active?t().active:t().inactive)+'</small></div><div class="rule-meta">'+(r.calculation_type==='per_minute'?money(r.amount)+' / min':money(r.amount))+'</div><div class="actions"><button class="ghost" onclick="openRule('+r.id+')">✏️</button><button class="danger" onclick="deleteRule('+r.id+')">🗑️</button></div></div>').join('')+'</section>';
if(tab==='history')h='<section><h2>'+t().history+'</h2>'+logs.map(x=>'<div class="log"><b class="action">'+esc(actionLabel(x.action))+'</b><div><span>'+esc(x.details||'')+'</span><small>'+new Date(x.created_at).toLocaleString(L==='pt'?'pt-PT':'en-GB')+'</small></div></div>').join('')+'</section>';
document.getElementById('app').innerHTML=h}
function closeModal(){document.getElementById('modal').innerHTML=''}function modal(x){document.getElementById('modal').innerHTML='<div class="modalwrap" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">'+x+'</div></div>'}
function openFine(id){let f=fines.find(x=>x.id==id)||{};modal('<form onsubmit="saveFine(event,'+(f.id||0)+')"><h2>'+t().add+'</h2><label>'+t().person+'<select name="m" required><option></option>'+members.filter(m=>m.active).map(m=>'<option value="'+m.id+'" '+(m.id==f.team_member_id?'selected':'')+'>'+esc(m.name)+'</option>').join('')+'</select></label><label>'+t().fineType+'<select name="r" id="rf" required onchange="extra()"><option></option>'+rules.filter(r=>r.active).map(r=>'<option value="'+r.id+'" '+(r.id==f.fine_type_id?'selected':'')+'>'+esc(rn(r))+'</option>').join('')+'</select></label><div id="extra"></div><label>'+t().date+'<input type="date" name="date" value="'+(f.fine_date||new Date().toISOString().slice(0,10))+'" required></label><label>'+t().notes+'<textarea name="notes">'+esc(f.notes||'')+'</textarea></label><label>'+t().status+'<select name="status"><option value="unpaid" '+(f.status!=='paid'?'selected':'')+'>'+t().unpaid+'</option><option value="paid" '+(f.status==='paid'?'selected':'')+'>'+t().paid+'</option></select></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">'+t().cancel+'</button><button class="btn">'+t().save+'</button></div></form>');extra(f)}
function extra(f={}){let r=rules.find(x=>x.id==document.getElementById('rf')?.value),e=document.getElementById('extra');if(!e)return;e.innerHTML=r?.calculation_type==='per_minute'?'<label>'+t().minutes+'<input type="number" min="0" name="minutes" value="'+(f.minutes||0)+'" required></label>':r?.calculation_type==='custom'?'<label>'+t().amount+'<input type="number" min="0" step="0.01" name="custom" value="'+(f.amount||0)+'" required></label>':''}
async function saveFine(e,id){e.preventDefault();let fd=new FormData(e.target),r=rules.find(x=>x.id==fd.get('r')),mins=null,a=Number(r?.amount||0);if(r?.calculation_type==='per_minute'){mins=Math.max(0,Number(fd.get('minutes')||0));a*=mins}if(r?.calculation_type==='custom')a=Math.max(0,Number(fd.get('custom')||0));let st=fd.get('status'),p={team_member_id:Number(fd.get('m')),fine_type_id:Number(fd.get('r')),fine_type_name_pt:r?.name_pt||'',fine_type_name_en:r?.name_en||'',fine_date:fd.get('date'),minutes:mins,amount:Number(a.toFixed(2)),notes:fd.get('notes')||null,status:st,paid_at:st==='paid'?new Date().toISOString():null};if(id)await db.from('fines').update(p).eq('id',id);else await db.from('fines').insert(p);await log(id?'fine_edited':'fine_created',(members.find(m=>m.id===p.team_member_id)?.name||'')+' · '+money(p.amount));closeModal();refresh()}
async function togglePaid(id){let f=fines.find(x=>x.id==id),paid=f.status!=='paid';await db.from('fines').update({status:paid?'paid':'unpaid',paid_at:paid?new Date().toISOString():null}).eq('id',id);await log(paid?'fine_paid':'fine_unpaid',f.team_members?.name||'');refresh()}
async function deleteFine(id){if(!confirm(t().confirm))return;let f=fines.find(x=>x.id==id);await db.from('fines').delete().eq('id',id);await log('fine_deleted',f?.team_members?.name||'');refresh()}
function openMember(id){let m=members.find(x=>x.id==id)||{};modal('<form onsubmit="saveMember(event,'+(m.id||0)+')"><h2>'+t().team+'</h2><label>'+t().name+'<input name="name" value="'+esc(m.name||'')+'" required></label><label>'+t().type+'<select name="type"><option value="player" '+(m.member_type!=='coach'?'selected':'')+'>'+t().player+'</option><option value="coach" '+(m.member_type==='coach'?'selected':'')+'>'+t().coach+'</option></select></label><label>'+t().status+'<select name="active"><option value="true" '+(m.active!==false?'selected':'')+'>'+t().active+'</option><option value="false" '+(m.active===false?'selected':'')+'>'+t().inactive+'</option></select></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">'+t().cancel+'</button><button class="btn">'+t().save+'</button></div></form>')}
async function saveMember(e,id){e.preventDefault();let fd=new FormData(e.target),p={name:fd.get('name'),member_type:fd.get('type'),active:fd.get('active')==='true'};if(id)await db.from('team_members').update(p).eq('id',id);else await db.from('team_members').insert(p);await log(id?'member_edited':'member_created',p.name);closeModal();refresh()}
async function deleteMember(id){if(!confirm(t().confirm))return;let m=members.find(x=>x.id==id),q=await db.from('team_members').delete().eq('id',id);if(q.error){alert(L==='pt'?'Não é possível apagar uma pessoa com multas associadas. Marca-a como inativa.':'Cannot delete a person with linked fines. Mark them inactive instead.');return}await log('member_deleted',m?.name||'');refresh()}
function openRule(id){let r=rules.find(x=>x.id==id)||{};modal('<form onsubmit="saveRule(event,'+(r.id||0)+')"><h2>'+t().rules+'</h2><label>Nome PT<input name="pt" value="'+esc(r.name_pt||'')+'" required></label><label>Name EN<input name="en" value="'+esc(r.name_en||'')+'" required></label><label>'+t().calc+'<select name="calc"><option value="fixed" '+(r.calculation_type==='fixed'?'selected':'')+'>'+t().fixed+'</option><option value="per_minute" '+(r.calculation_type==='per_minute'?'selected':'')+'>'+t().perMinute+'</option><option value="custom" '+(r.calculation_type==='custom'?'selected':'')+'>'+t().custom+'</option></select></label><label>'+t().amount+'<input type="number" min="0" step="0.01" name="amount" value="'+(r.amount||0)+'" required></label><label>'+t().descPT+'<textarea name="dpt">'+esc(r.description_pt||'')+'</textarea></label><label>'+t().descEN+'<textarea name="den">'+esc(r.description_en||'')+'</textarea></label><label>'+t().status+'<select name="active"><option value="true" '+(r.active!==false?'selected':'')+'>'+t().active+'</option><option value="false" '+(r.active===false?'selected':'')+'>'+t().inactive+'</option></select></label><div class="actions"><button type="button" class="ghost" onclick="closeModal()">'+t().cancel+'</button><button class="btn">'+t().save+'</button></div></form>')}
async function saveRule(e,id){e.preventDefault();let fd=new FormData(e.target),p={name_pt:fd.get('pt'),name_en:fd.get('en'),description_pt:fd.get('dpt')||null,description_en:fd.get('den')||null,calculation_type:fd.get('calc'),amount:Number(fd.get('amount')),active:fd.get('active')==='true'};if(id)await db.from('fine_types').update(p).eq('id',id);else await db.from('fine_types').insert(p);await log(id?'rule_edited':'rule_created',L==='pt'?p.name_pt:p.name_en);closeModal();refresh()}
async function deleteRule(id){if(!confirm(t().confirm))return;let r=rules.find(x=>x.id==id);await db.from('fine_types').delete().eq('id',id);await log('rule_deleted',rn(r));refresh()}
async function log(action,details){await db.from('activity_history').insert({action,details})}
document.getElementById('langPt').onclick=()=>{L='pt';localStorage.clip_lang=L;render()};document.getElementById('langEn').onclick=()=>{L='en';localStorage.clip_lang=L;render()};refresh();
</script></body></html>
